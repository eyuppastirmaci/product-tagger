# The dev secret lives only in this opt-in profile; the default (hosted)
# profile refuses to boot without a real JWT_SECRET
auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}

spring:
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:${OLLAMA_PORT:11434}}
      chat:
        model: ${OLLAMA_MODEL:qwen3.5:4b}
        # Classification task: low temperature for consistent answers
        temperature: 0.1
